<html class="dark"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ecc8",
                        "background-light": "#f6f8f8",
                        "background-dark": "#10221f",
                    },
                    fontFamily: {
                        "display": ["Manrope"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen pb-24">
<!-- Header -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-primary/10">
<div class="flex items-center p-4 justify-between max-w-md mx-auto">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary">arrow_back</span>
<h2 class="text-xl font-bold tracking-tight">Settings</h2>
</div>
<div class="size-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-xl">school</span>
</div>
</div>
</header>
<main class="max-w-md mx-auto p-4 space-y-8">
<!-- Profile Settings Section -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">person</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Profile Settings</h3>
</div>
<div class="space-y-4 bg-slate-100/50 dark:bg-primary/5 p-4 rounded-xl border border-primary/10">
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium ml-1">Full Name</span>
<input class="w-full rounded-lg border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-primary dark:placeholder:text-slate-600 text-sm py-3 px-4" placeholder="e.g. Alex Johnson" type="text"/>
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium ml-1">Email Address</span>
<input class="w-full rounded-lg border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-primary dark:placeholder:text-slate-600 text-sm py-3 px-4" placeholder="alex.j@university.edu" type="email"/>
</label>
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium ml-1">College / University</span>
<input class="w-full rounded-lg border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-primary dark:placeholder:text-slate-600 text-sm py-3 px-4" placeholder="State Institute of Tech" type="text"/>
</label>
</div>
</section>
<!-- Academic Preferences Section -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">settings_suggest</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Academic Preferences</h3>
</div>
<div class="space-y-6 bg-slate-100/50 dark:bg-primary/5 p-4 rounded-xl border border-primary/10">
<label class="flex flex-col gap-1.5">
<span class="text-sm font-medium ml-1">Default study hours per day</span>
<select class="w-full rounded-lg border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-primary text-sm py-3 px-4 appearance-none">
<option>1-2 Hours</option>
<option selected="">3-4 Hours</option>
<option>5-6 Hours</option>
<option>7+ Hours</option>
</select>
</label>
<div class="space-y-3">
<span class="text-sm font-medium ml-1">Deadline Preference</span>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border-2 border-primary bg-primary/10 text-primary font-semibold text-sm">
<span class="material-symbols-outlined text-lg">event_busy</span> Strict
                        </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border-2 border-transparent bg-white dark:bg-background-dark text-slate-500 dark:text-slate-400 font-semibold text-sm">
<span class="material-symbols-outlined text-lg">event_available</span> Flexible
                        </button>
</div>
</div>
<div class="space-y-3">
<span class="text-sm font-medium ml-1">Output Format</span>
<div class="flex bg-white dark:bg-background-dark p-1 rounded-xl border border-primary/10">
<button class="flex-1 py-2 text-xs font-bold rounded-lg bg-primary text-background-dark">BRIEF</button>
<button class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-500">DETAILED</button>
</div>
</div>
</div>
</section>
<!-- Interface Settings -->
<section class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-sm">palette</span>
<h3 class="text-sm font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Appearance</h3>
</div>
<div class="flex items-center justify-between bg-slate-100/50 dark:bg-primary/5 p-4 rounded-xl border border-primary/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-slate-500">dark_mode</span>
<div>
<p class="text-sm font-medium">Dark Mode</p>
<p class="text-xs text-slate-500">Current: On</p>
</div>
</div>
<div class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-slate-300 dark:bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</div>
</section>
<!-- Actions -->
<div class="pt-4 space-y-3">
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-colors">
                Save Changes
            </button>
<button class="w-full bg-transparent border-2 border-primary/20 text-slate-500 dark:text-slate-400 font-bold py-4 rounded-xl hover:bg-primary/5 transition-colors">
                Reset to Default
            </button>
</div>
</main>
<!-- Bottom Nav Bar Component Integrated -->
<nav class="fixed bottom-0 left-0 right-0 z-50 bg-background-light dark:bg-[#1c2725] border-t border-primary/10 px-4 pb-6 pt-2">
<div class="flex max-w-md mx-auto gap-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">menu_book</span>
</div>
<p class="text-[10px] font-medium leading-normal">Library</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">auto_awesome</span>
</div>
<p class="text-[10px] font-medium leading-normal">AI Chat</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-slate-400" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">analytics</span>
</div>
<p class="text-[10px] font-medium leading-normal">Insights</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-primary" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">settings</span>
</div>
<p class="text-[10px] font-medium leading-normal">Settings</p>
</a>
</div>
</nav>
</body></html>
